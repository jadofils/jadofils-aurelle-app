spring:
  application:
    name: aurelle
  profiles:
    # Environments that load test seed data (db/seed). `prod` is deliberately absent.
    group:
      dev: seed
      test: seed
      testing: seed
      staging: seed
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # No credential defaults are committed. Set AURELLE_DB_* in the environment.
    url: ${AURELLE_DB_URL:jdbc:postgresql://localhost:5432/aurelle}
    username: ${AURELLE_DB_USER:aurelle}
    password: ${AURELLE_DB_PASSWORD:}
    hikari:
      # One bounded pool per process. Size it against (replicas x pool) <= the DB connection budget.
      maximum-pool-size: ${AURELLE_DB_POOL_MAX:10}
      minimum-idle: ${AURELLE_DB_POOL_MIN_IDLE:2}
      connection-timeout: 2000
      validation-timeout: 1000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
      data-source-properties:
        # Server-side guards so no statement or lock wait runs unbounded.
        options: "-c statement_timeout=${AURELLE_DB_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${AURELLE_DB_LOCK_TIMEOUT_MS:2000} -c idle_in_transaction_session_timeout=${AURELLE_DB_IDLE_TX_TIMEOUT_MS:15000}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  graphql:
    http:
      path: /graphql
    websocket:
      path: /graphql
      connection-init-timeout: 10s
  mail:
    # SMTP (decision D28). Values come from AURELLE_MAIL_* env vars; the dev profile also reads ../.env.
    host: ${AURELLE_MAIL_HOST:}
    port: ${AURELLE_MAIL_PORT:587}
    username: ${AURELLE_MAIL_USERNAME:}
    password: ${AURELLE_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    async:
      # Upper bound for a GraphQL HTTP request (GraphQL over MVC runs asynchronously).
      request-timeout: 10s

aurelle:
  api:
    version: "@project.version@"
    contract-phase: 1
  graphql:
    max-depth: ${AURELLE_GRAPHQL_MAX_DEPTH:12}
    max-complexity: ${AURELLE_GRAPHQL_MAX_COMPLEXITY:500}
  organization:
    default-slug: aurelle
  mail:
    # Off unless explicitly enabled, so tests and CI never send real e-mail.
    enabled: ${AURELLE_MAIL_ENABLED:false}
    from: ${AURELLE_MAIL_FROM:no-reply@example.test}
    from-name: ${AURELLE_MAIL_FROM_NAME:Aurelle}
    test-recipient: ${AURELLE_MAIL_TEST_RECIPIENT:}
  identity:
    # Decision D5. Tokens are opaque; only hashes are stored.
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verify-ttl: 24h
    password-reset-ttl: 30m
    staff-invite-ttl: 72h
    max-failed-sign-ins: 5
    lock-duration: 15m
    # Server key for hashing 6-digit codes. Set it in every shared environment (secret).
    code-hmac-key: ${AURELLE_CODE_HMAC_KEY:}
    terms-version: "2026-10"
    # Browser origins whose session cookies are accepted (CSRF protection), comma-separated.
    allowed-origins: ${AURELLE_ALLOWED_ORIGINS:http://localhost:8081}
    secure-cookies: ${AURELLE_SECURE_COOKIES:true}
  web:
    # Base URL of the Flutter web app; used in e-mail links.
    public-url: ${AURELLE_PUBLIC_WEB_URL:http://localhost:8081}

server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    max-swallow-size: 2MB
    accept-count: 100
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      # E-mail is not critical: an SMTP outage must not make the service unhealthy (and restart it).
      enabled: false
