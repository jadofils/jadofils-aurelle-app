# SonarQube Cloud: one project for the whole repository (backend Java + frontend Dart).
sonar.projectKey=jadofils_jadofils-aurelle-app
sonar.organization=jadofils
sonar.projectName=jadofils-aurelle-app
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main,frontend/lib
sonar.tests=backend/src/test,frontend/test

# Java: compiled classes and reports come from the CI "backend" job artifact.
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports,backend/target/failsafe-reports

# Dart/Flutter: coverage from `flutter test --coverage`.
sonar.dart.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage exclusions. Keep this list short; every entry needs a reason:
#  - AurelleApplication.java / main.dart: process entry points only (no logic)
#  - *.g.dart, *.freezed.dart, *.graphql.dart, *.gr.dart: generated code
sonar.coverage.exclusions=\
  backend/src/main/java/com/aurelle/AurelleApplication.java,\
  frontend/lib/main.dart,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.graphql.dart,\
  **/*.gr.dart

# Generated code is not analysed at all.
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/*.graphql.dart,**/*.gr.dart
