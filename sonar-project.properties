# SonarQube Cloud: one project for the whole repository.
#   Backend  = Maven, Java 21   (backend/)
#   Frontend = Flutter, Dart    (frontend/)
# One scanner (sonarqube-scan-action in .github/workflows/pipeline.yml) analyses both. The Maven build
# runs first in the "backend" job and hands over compiled classes + JaCoCo/JUnit reports; the "frontend"
# job hands over lcov coverage. (Sonar's per-language Maven plugin is not used because it would analyse
# only the Maven module, not the Flutter app.)
sonar.projectKey=jadofils_jadofils-aurelle-app
sonar.organization=jadofils
sonar.projectName=jadofils-aurelle-app
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------------------------------
# Analysis scope. SonarQube Cloud scans the whole repository (sonar.sources/sonar.tests have no effect),
# so the scope is defined by what is EXCLUDED and which paths are TEST code.
#
# Analysed as production code:
#   backend/src/main/**          Java (Maven), SQL migrations, config
#   backend/pom.xml, backend/Dockerfile
#   frontend/lib/**              Dart (Flutter)
#   frontend/pubspec.yaml, frontend/Dockerfile
#   ci/**, .github/workflows/**  shell scripts and pipeline (security rules apply)
# Analysed as test code (rules for tests, never counted for coverage):
#   backend/src/test/**, frontend/test/**, frontend/integration_test/**, tests/** (E2E, load, contract)
# Not analysed: build output, Flutter platform folders generated by `flutter create`, generated code,
#   documentation and contracts (Markdown / GraphQL SDL have no analyser).
# ---------------------------------------------------------------------------------------------------
sonar.test.inclusions=backend/src/test/**,frontend/test/**,frontend/integration_test/**,tests/**

sonar.exclusions=\
  **/target/**,\
  **/build/**,\
  **/.dart_tool/**,\
  **/node_modules/**,\
  frontend/android/**,\
  frontend/ios/**,\
  frontend/web/**,\
  frontend/linux/**,\
  frontend/macos/**,\
  frontend/windows/**,\
  docs/**,\
  contracts/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.graphql.dart,\
  **/*.gr.dart

# ---------------------------------------------------------------------------------------------------
# Backend (Maven, Java 21): classes and reports come from the CI "backend" job artifact.
# ---------------------------------------------------------------------------------------------------
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target/surefire-reports,backend/target/failsafe-reports

# ---------------------------------------------------------------------------------------------------
# Frontend (Flutter, Dart): coverage from `flutter test --coverage`.
# ---------------------------------------------------------------------------------------------------
sonar.dart.lcov.reportPaths=frontend/coverage/lcov.info

# ---------------------------------------------------------------------------------------------------
# Coverage exclusions. Keep this list short; every entry needs a reason:
#  - test trees: test code is not code under test (safety net for sonar.test.inclusions)
#  - AurelleApplication.java / main.dart: process entry points only (no logic)
#  - *.g.dart, *.freezed.dart, *.graphql.dart, *.gr.dart: generated code
# ---------------------------------------------------------------------------------------------------
sonar.coverage.exclusions=\
  backend/src/test/**,\
  frontend/test/**,\
  frontend/integration_test/**,\
  tests/**,\
  backend/src/main/java/com/aurelle/AurelleApplication.java,\
  frontend/lib/main.dart,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/*.graphql.dart,\
  **/*.gr.dart

# Branches: the current plan analyses pull requests and the main branch only; CI therefore runs the scan
# on PRs and on pushes to main (see .github/workflows/pipeline.yml, job "sonar"). The project setting
# sonar.branch.longLivedBranches.regex = (main|staging|testing) takes effect if branch analysis becomes available.
